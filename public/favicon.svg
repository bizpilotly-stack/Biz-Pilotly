<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD068"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgNavy)" stroke="#262626" stroke-width="1.5"/>

  <!-- Minimal Abstract Direction / Control Nexus (Chevron & Diamond Alignment) -->
  <!-- Ascending Flight & Direction Wing (Deep Navy / Sky Blue Highlight) -->
  <path d="M 18 42 L 32 16 L 46 42 L 32 34 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  
  <!-- Central Guidance Compass / Diamond (Gold #C9A227) -->
  <polygon points="32,22 39,36 32,31 25,36" fill="url(#goldAccent)"/>
  
  <!-- Lower Stabilizer / Foundation Bar (Gold dot) -->
  <circle cx="32" cy="47" r="3" fill="#C9A227"/>
</svg>
